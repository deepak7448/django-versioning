name: Publish to PyPI

# Publishing a GitHub release (tag vX.Y.Z) builds the package and uploads it to PyPI
# with Trusted Publishing: no API token is stored anywhere, and PyPI records a signed
# provenance attestation for each file linking it to this repository and workflow run.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pyproject.toml version $version (expected v$version)"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-24.04
    # Must match the environment name configured for the trusted publisher on PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/django-versioning/
    permissions:
      id-token: write  # lets PyPI verify this workflow (Trusted Publishing) and sign attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload with provenance attestations
        uses: pypa/gh-action-pypi-publish@release/v1
