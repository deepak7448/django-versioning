name: Django CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check package metadata and README rendering
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Test jobs install the wheel built above, the way users get the package.
  # (Building from source needs setuptools 77+, which doesn't run on Python 3.8.)
  sqlite:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    needs: build
    # Pinned: Python 3.8 and 3.9 aren't available for newer Ubuntu images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.8", django: "3.2" }
          - { python: "3.9", django: "4.2" }
          - { python: "3.10", django: "4.2" }
          - { python: "3.11", django: "5.2" }
          - { python: "3.12", django: "5.2" }
          - { python: "3.12", django: "6.1" }
          - { python: "3.13", django: "6.0" }
          - { python: "3.13", django: "6.1" }
          - { python: "3.14", django: "6.1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl "Django~=${{ matrix.django }}.0"
      - name: Package tests
        run: python -W error::DeprecationWarning runtests.py
      - name: Example project tests
        working-directory: examples
        run: python manage.py test blog

  postgres:
    name: PostgreSQL / Django ${{ matrix.django }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        django: ["4.2", "6.1"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl "Django~=${{ matrix.django }}.0" "psycopg[binary]"
      - name: Package tests, including concurrent writers
        run: python runtests.py

  mysql:
    name: MySQL / Django ${{ matrix.django }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        django: ["4.2", "6.1"]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: versioning
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: versioning
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the built wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libmysqlclient-dev
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl "Django~=${{ matrix.django }}.0" mysqlclient
      - name: Package tests, including concurrent writers
        run: python runtests.py
