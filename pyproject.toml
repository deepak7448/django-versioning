[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-versioning"
version = "0.2.0"
description = "Version history, diffs, rollback, soft delete and audit trails for Django models, with a read-only admin."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deepak Prajapati", email = "prajapatideepak244@gmail.com" }]
requires-python = ">=3.8"
dependencies = [
    "Django>=3.2",
    "django-crequest>=2018.5.11",
    "django-admin-rangefilter>=0.11.0",
]
keywords = ["django", "versioning", "version-control", "history", "audit", "audit-trail", "rollback", "soft-delete", "diff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/deepak7448/django-versioning"
Source = "https://github.com/deepak7448/django-versioning"
Issues = "https://github.com/deepak7448/django-versioning/issues"
Changelog = "https://github.com/deepak7448/django-versioning/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = ["version_control", "version_control.migrations"]
zip-safe = false
